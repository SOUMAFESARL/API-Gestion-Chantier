[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = apps tests
addopts = --strict-markers --disable-warnings
markers =
    entreprise: test exécuté avec une entreprise active
    lent: test lent, exclu de la boucle rapide
    carac: test de caractérisation du comportement existant
    regle: test d'une nouvelle règle introduite par le lot
