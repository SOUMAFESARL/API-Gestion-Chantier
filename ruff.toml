line-length = 100
target-version = "py313"

exclude = [".venv", "migrations", "staticfiles", "media"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "RUF012",  # les attributs de classe Django ne sont pas des ClassVar
    "N999",    # noms d'applications en français
]

[lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # `from .base import *` est volontaire
"**/tests/*.py" = ["S101"]

[lint.isort]
known-first-party = ["apps", "config"]
