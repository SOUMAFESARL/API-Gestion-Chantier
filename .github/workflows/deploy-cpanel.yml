name: Tests et deploiement cPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccd
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ccd_digital
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccd -d ccd_digital"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: ccd
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: ccd_digital
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/local.txt
      - run: python manage.py check
      # Ce test compare un fichier d'un autre depot, absent du backend.
      # Il doit etre execute dans une CI qui extrait aussi le vrai frontend.
      - name: Tests du backend
        run: >-
          python -m pytest apps -q
          --deselect=apps/projets/tests/test_meteo.py::test_le_referentiel_typescript_ne_derive_pas

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CPANEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
      APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
      PYTHON_BIN: ${{ vars.CPANEL_PYTHON_BIN }}
      HEALTH_URL: ${{ vars.CPANEL_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurer SSH et verifier les parametres
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$APP_ROOT" =~ ^/home/[a-zA-Z0-9_./-]+$ ]]
          [[ "$PYTHON_BIN" =~ ^/home/[a-zA-Z0-9_./-]+$ ]]
          [[ "$HEALTH_URL" == https://* ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Mettre a jour le commit teste et redemarrer Passenger
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_command 'bash -s -- %q %q %q' "$APP_ROOT" "$PYTHON_BIN" "$GITHUB_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$remote_command" < scripts/deploy-cpanel.sh
      - name: Verifier la reponse HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
                "$HEALTH_URL" -o /tmp/api-health.json && \
                python -c 'import json; assert json.load(open("/tmp/api-health.json"))["statut"] == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo 'La verification HTTPS a echoue. Consulter les journaux Passenger.' >&2
          exit 1
      - name: Retirer la cle du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
