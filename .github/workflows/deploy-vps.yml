name: Deploy to VPS Hostinger

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement Backend sur VPS Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Vérifier les secrets VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for var in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret manquant : $var"
              exit 1
            fi
          done

      - name: Déployer sur le VPS Hostinger (SSH restreint)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/id_deploy' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/id_deploy \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${VPS_USER}@${VPS_HOST}" \
            "deploy-backend"
