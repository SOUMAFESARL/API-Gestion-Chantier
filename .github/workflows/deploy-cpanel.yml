name: Tests et déploiement production cPanel

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      run_migrate:
        description: "Lancer migrate (mettre false pour déployer le code seul)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cpanel-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifications:
    # Décision du développeur (29/10/2026) : les tests automatisés sont supprimés le temps de
    # la refonte du découpage. Restent les vérifications qui ne dépendent d'aucun test : la
    # configuration Django se charge, et aucune migration ne manque au regard des modèles.
    name: Vérifications Django
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: ccd
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ccd_digital

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ccd -d ccd_digital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production

      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: ccd
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: ccd_digital

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/local.txt

      - name: Vérifier la configuration Django
        run: |
          python manage.py check

      - name: Vérifier qu'aucune migration ne manque
        run: |
          python manage.py makemigrations --check --dry-run

  deploy:
    name: Déploiement production sur cPanel
    needs: verifications

    if: ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Préparer le redémarrage Passenger
        shell: bash
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

      - name: Déployer sur cPanel par FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: ./
          server-dir: /public_html/api-chantier/

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            **/.env
            **/.env.*
            **/venv/**
            **/env/**
            **/.venv/**
            **/node_modules/**
            **/tests/**
            **/.pytest_cache/**
            **/media/**
            **/staticfiles/**
            **/*.sqlite3
            **/personas_extracted.json
            **/*.xlsx
            **/.kilo/**

      # C'est désormais la **seule** voie des migrations : `passenger_wsgi.py` ne migre plus au
      # démarrage, et l'étape SSH ci-dessous ne tourne pas tant que CPANEL_PROJECT_DIR est vide.
      # Un échec doit donc faire échouer le déploiement, et non passer sous un `|| true`.
      - name: Déclencher les migrations et la synchronisation des registres (API)
        shell: bash
        env:
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$MAINTENANCE_TOKEN" ]; then
            echo "::error::Secret MAINTENANCE_TOKEN absent : les migrations ne peuvent pas être lancées."
            exit 1
          fi

          # Passenger redémarre sur tmp/restart.txt : le premier appel paie le démarrage.
          for tentative in 1 2 3 4 5 6; do
            sleep 10
            code=$(curl -sS -o /tmp/migration.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 600 \
              -X POST "https://api-chantier.soumafe.com/api/v1/maintenance/migrer-bd/" \
              -H "Content-Type: application/json" \
              -H "X-Maintenance-Token: $MAINTENANCE_TOKEN") || code="000"

            if [ "$code" = "200" ] && grep -q '"statut": *"succes"' /tmp/migration.json; then
              echo "Migrations appliquées (tentative $tentative)."
              python3 -c "import json; print(json.load(open('/tmp/migration.json'))['output'])"
              exit 0
            fi

            echo "Tentative $tentative : HTTP $code"
            head -c 2000 /tmp/migration.json 2>/dev/null || true
            echo
            # 403 et 404 ne se corrigent pas en réessayant : jeton ou empreinte à revoir.
            if [ "$code" = "403" ] || [ "$code" = "404" ]; then
              echo "::error::Endpoint de migration refusé (HTTP $code) : vérifier le secret MAINTENANCE_TOKEN et MAINTENANCE_TOKEN_SHA256."
              exit 1
            fi
          done

          echo "::error::Les migrations n'ont pas pu être appliquées après 6 tentatives."
          exit 1

      - name: Appliquer les migrations Django (SSH)
        if: ${{ vars.CPANEL_PROJECT_DIR != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          command_timeout: 10m
          envs: GITHUB_SHA
          script: |
            set -euo pipefail

            # ── Chemins configurés via les variables GitHub ──
            PROJECT_DIR="${{ vars.CPANEL_PROJECT_DIR }}"
            VENV_PYTHON="${{ vars.CPANEL_VENV_PYTHON }}"

            cd "$PROJECT_DIR"

            echo "=== Installation des dependances backend ==="
            "$VENV_PYTHON" -m pip install -r requirements/base.txt

            # ── 1. Sauvegarde obligatoire vérifiée avant toute migration ──
            echo ""
            echo "=== Sauvegarde PostgreSQL de securite pre-migration ==="
            chmod +x scripts/backup_db.sh scripts/audit_catalogue.py || true

            set -a
            [ -f .env ] && . .env
            set +a
            DB_NAME="${POSTGRES_DB:-ccd_digital}"
            DB_USER="${POSTGRES_USER:-ccd}"
            DB_HOST="${POSTGRES_HOST:-localhost}"
            DB_PORT="${POSTGRES_PORT:-5432}"
            PGPASSWORD="${POSTGRES_PASSWORD:-}"
            export DB_NAME DB_USER DB_HOST DB_PORT PGPASSWORD

            ./scripts/backup_db.sh "pre-deploy-${GITHUB_SHA:0:7}"

            # ── 2. Migrations Django (conditionnees par run_migrate) ──
            RUN_MIGRATE="${{ github.event.inputs.run_migrate || 'true' }}"
            if [ "$RUN_MIGRATE" = "true" ]; then
              echo ""
              echo "=== Migrations en attente AVANT migrate ==="
              "$VENV_PYTHON" manage.py showmigrations --list 2>&1 | grep '\[ \]' || echo "(aucune migration en attente)"

              echo ""
              echo "=== Exécution de migrate --noinput ==="
              "$VENV_PYTHON" manage.py migrate --noinput 2>&1

              echo ""
              echo "=== Vérification APRÈS migrate ==="
              PENDING=$("$VENV_PYTHON" manage.py showmigrations --list 2>&1 | grep '\[ \]' || true)
              if [ -n "$PENDING" ]; then
                echo "⚠️  ATTENTION : migrations encore en attente :"
                echo "$PENDING"
                exit 1
              fi
              echo "✅ Toutes les migrations sont appliquées."
            else
              echo ""
              echo "=== Migration ignorée (run_migrate=false) ==="
            fi

            echo ""
            echo "=== Rattrapage des inscriptions en attente ==="
            "$VENV_PYTHON" manage.py provisionner_inscriptions 2>&1 || true

            echo ""
            echo "=== Synchronisation du registre global des emails ==="
            "$VENV_PYTHON" manage.py remplir_registre_global 2>&1 || true

            echo ""
            echo "=== Synchronisation du catalogue des permissions ==="
            "$VENV_PYTHON" manage.py synchroniser_catalogue_permissions 2>&1 || true

            echo ""
            echo "=== Propagation des rôles système multi-tenant ==="
            "$VENV_PYTHON" manage.py propager_roles_systeme 2>&1 || true

            echo ""
            echo "=== Renouvellement abonnement Kouassi Ange Félix (e_3at_btp) ==="
            "$VENV_PYTHON" manage.py gerer_entreprises --activer-abonnement e_3at_btp --plan MAITRE_OEUVRE --duree-jours 365 2>&1 || true

            echo ""
            echo "=== Tâche cron de nuit F3 (00 h 01) ==="
            # Sans Celery Beat sur cPanel, l'évaluation de nuit du suivi d'avancement
            # (retards, statuts, alertes, indice de santé) passe par la crontab du
            # compte — celle de l'écran « Tâches cron ». La ligne porte une marque :
            # elle est remplacée à chaque déploiement, jamais dupliquée.
            mkdir -p logs
            MARQUE="# ccd:evaluer_f3_nuit"
            LIGNE="1 0 * * * cd \"$PROJECT_DIR\" && { set -a; [ -f .env ] && . ./.env; set +a; } && \"$VENV_PYTHON\" manage.py evaluer_f3_nuit --settings=config.settings.cpanel >> \"$PROJECT_DIR/logs/evaluer_f3_nuit.log\" 2>&1 $MARQUE"
            if { crontab -l 2>/dev/null | grep -vF "$MARQUE" || true; echo "$LIGNE"; } | crontab -; then
              crontab -l | grep -F "$MARQUE"
              echo "Heure du serveur (la crontab suit ce fuseau) : $(date '+%H:%M %Z')"
            else
              echo "⚠️  crontab indisponible : ajouter la tâche à la main dans cPanel → Tâches cron."
            fi

            echo ""
            echo "=== Redémarrage Passenger ==="
            mkdir -p tmp
            touch tmp/restart.txt

      - name: Vérifier la disponibilité de l’API
        if: ${{ vars.CPANEL_HEALTH_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "${{ vars.CPANEL_HEALTH_URL }}" \
              -o /tmp/api-health.json; then

              echo "API de production disponible."
              cat /tmp/api-health.json
              exit 0
            fi

            echo "API indisponible. Nouvelle tentative dans 5 secondes..."
            sleep 5
          done

          echo "La vérification de l'API de production a échoué."
          exit 1
